server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Matches the backend's own multipart limit, so a file the API would accept is
    # not rejected a layer earlier with an opaque 413.
    client_max_body_size 50M;

    # The API is served from this same origin, so the browser treats it as a
    # same-origin request and no CORS negotiation happens at all.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Statements and payslips are rendered on demand by headless Chromium,
        # which is slower than an ordinary JSON response — especially the first
        # one after a restart, when the browser is still starting up.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Vite writes content-hashed filenames here, so these can never go stale.
    # A prefix location rather than a regex on file extension: regex locations
    # take priority over prefix ones and would capture /api/ paths too.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing. /dashboard, /account and /pay/<id> are React routes
    # with no file behind them, so anything that is not a real file falls back to
    # the app shell instead of 404ing — which is what a hard refresh or a shared
    # payment link would otherwise do.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
