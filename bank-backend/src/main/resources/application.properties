spring.application.name=mldsa
spring.datasource.url=jdbc:postgresql://localhost:5432/mldsa
spring.datasource.name=mldsa
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Auto-create/update tables from the @Entity classes — fine for this demo stage,
spring.jpa.hibernate.ddl-auto=update

# Where uploaded files are actually stored on disk (relative to where the app is run from)
app.file-storage-path=./storage/files

# Multipart upload limits — raise if you expect larger bank files
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# AES-256 master key used to encrypt private keys (ML-DSA signing keys, ML-KEM decryption
# keys) at rest in the `users` table — see CryptoService's "Private-key encryption at rest"
# comment for the full rationale. Overridden by the APP_MASTER_KEY env var in any real
# deployment; the literal fallback below only exists so `mvn spring-boot:run` still works
# out of the box for local demo/dev use — do not deploy this default anywhere reachable by
# anyone else. Rotate it (and re-register affected accounts — there's no re-encryption
# tooling yet) if it's ever suspected to have leaked.
app.master-key=${APP_MASTER_KEY:demo-only-insecure-master-key-change-me-before-anything-real}

# HMAC signing secret for the bearer tokens issued at login (see JwtService). Same
# override/rotation rationale as app.master-key above — set APP_JWT_SECRET for anything
# beyond local demo use.
app.jwt-secret=${APP_JWT_SECRET:demo-only-insecure-jwt-secret-change-me-before-anything-real}
