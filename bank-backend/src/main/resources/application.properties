spring.application.name=mldsa
spring.datasource.url=jdbc:postgresql://localhost:5432/mldsa
spring.datasource.name=mldsa
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# The schema is owned by Flyway migrations in src/main/resources/db/migration, including
# the per-module Postgres schemas (identity, ledger, payments, cards, filetransfer) the
# entities live in. Hibernate only validates: startup fails if an entity and the migrated
# schema disagree, rather than Hibernate quietly altering tables. update never revised a
# constraint once created, which is how a stale enum CHECK constraint once shipped.
# Any entity change now needs a new migration alongside it.
spring.jpa.hibernate.ddl-auto=validate

# JWT signing key for the centralized login. HS256 requires at least 256 bits, so this
# must stay 32+ characters or the app will refuse to start.
# DEV VALUE ONLY — override via the APP_JWT_SECRET environment variable anywhere real;
# anyone holding this string can mint a token for any account, including a BANK one.
app.jwt.secret=${APP_JWT_SECRET:dev-only-insecure-signing-key-change-me-32b}
app.jwt.expiry-minutes=120

# Currency every account is opened in. Single-currency for now, but held as configuration
# rather than hard-coded so supporting another one later is additive.
app.ledger.default-currency=TZS

# Ceilings on what can leave an account: one payment, and one account's total for a UTC
# day. Deposits are not capped — these bound outgoing money, and a deposit only adds.
# A basic control rather than fraud monitoring: it limits the damage a bug or a
# compromised account can do, but detects nothing.
app.payments.max-per-transaction=5000000.00
app.payments.max-per-day=10000000.00

# How far an institution's settlement position may go negative before its customers' outgoing
# inter-bank payments are refused. A negative position means the institution is a net debtor to
# the rest of the system, which is normal between settlement runs — unbounded, it would let one
# bank owe the others without limit. Applied to each institution independently; a per-institution
# override is a natural later addition.
app.settlement.net-debit-cap=5000000.00

# How long a payment request stays payable. Also the default when a link is created
# without one, so a link always has a deadline rather than living forever by omission.
app.payments.link-max-lifetime-hours=168

# How long an issued debit card remains valid. Cards expire at the end of that month,
# the way a real card's printed expiry works.
app.cards.validity-years=3

# Where uploaded files are actually stored on disk (relative to where the app is run from)
app.file-storage-path=./storage/files

# Multipart upload limits — raise if you expect larger bank files
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Names this system as the party initiating a pain.001 message. A real deployment would use
# the registered name of the institution operating the platform.
app.iso20022.initiating-party=MLDSA Test Bank

# Master key wrapping the per-file data encryption keys (AES-256-GCM at-rest encryption).
# Must decode to exactly 32 bytes; the application refuses to start otherwise.
# DEV VALUE ONLY — override via APP_STORAGE_MASTER_KEY. Anyone holding this key can decrypt
# every stored file, so it protects a stolen disk or database dump, not a compromised server.
app.storage.master-key=${APP_STORAGE_MASTER_KEY:bWxkc2EtZGV2LW9ubHktc3RvcmFnZS1tYXN0ZXIta2U=}
